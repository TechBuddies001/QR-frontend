# Main Website (scanner-web) with SSL
server {
    server_name tarkshyasolution.in www.tarkshyasolution.in;

    # New Scanner Web Root
    root /var/www/tarkshyasolution.in/html;
    index index.html;

    client_max_body_size 20M;

    location = /call-webhook.php {
        default_type application/json;
        return 200 '{"fetch_after_attempt":false,"destination":{"numbers":["+916290721134"]},"record":true,"recording_channels":"dual","max_ringing_duration":45,"max_conversation_duration":3600}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache index.html to ensure users always get the latest chunks
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy Next.js assets
    location ^~ /_next/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Proxy tag routes to Next.js
    location ^~ /tag/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Proxy scan routes to Next.js
    location ^~ /scan/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }

    # Scanner-web handles /scan and /tag routes locally via React Router
    # Backend API
    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads
    location /uploads/ {
        alias /var/www/final-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tarkshyasolution.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tarkshyasolution.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Admin Panel (final-frontend) Subdomain
server {
    server_name admin.tarkshyasolution.in;

    client_max_body_size 20M;

    location = /call-webhook.php {
        default_type application/json;
        return 200 '{"fetch_after_attempt":false,"destination":{"numbers":["+916290721134"]},"record":true,"recording_channels":"dual","max_ringing_duration":45,"max_conversation_duration":3600}';
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/final-backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.tarkshyasolution.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.tarkshyasolution.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP Redirects
server {
    listen 80;
    server_name tarkshyasolution.in www.tarkshyasolution.in ;
    return 301 https://tarkshyasolution.in$request_uri;
}

server {
    listen 80;
    server_name admin.tarkshyasolution.in;
    return 301 https://admin.tarkshyasolution.in$request_uri;
}
